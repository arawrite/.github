name: TypeScript checks

on:
  workflow_call:
    inputs:
      working-directory:
        description: The npm project's directory, relative to the repository root.
        type: string
        default: .

permissions:
  contents: read

jobs:
  checks:
    name: TypeScript checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-typescript-${{ inputs.working-directory }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ${{ inputs.working-directory }}/package.json
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Install
        id: install
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: prettier --check .
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: eslint --max-warnings 0 .
      - name: Types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: tsc --build
      - name: Tests
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: vitest run --coverage --coverage.reporter=lcov --coverage.reportsDirectory="$RUNNER_TEMP/coverage"
      - name: Coverage
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          awk -v gate=85 '
            /^DA:/ { split(substr($0, 4), record, ","); lines++; lines_hit += record[2] > 0 }
            /^BRDA:/ { split(substr($0, 6), record, ","); branches++; branches_hit += record[4] != "-" && record[4] > 0 }
            END {
              line_rate = lines ? 100 * lines_hit / lines : 0
              branch_rate = branches ? 100 * branches_hit / branches : 100
              printf "Coverage: lines %.2f%% (%d of %d), branches %.2f%% (%d of %d); the gate is %d%%.\n", line_rate, lines_hit, lines, branch_rate, branches_hit, branches, gate
              exit !(line_rate >= gate && branch_rate >= gate)
            }' "$RUNNER_TEMP/coverage/lcov.info" | tee -a "$GITHUB_STEP_SUMMARY"
